name: EXP-041 Final Gate-A Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-041-final-gate-a-audit.txt'

permissions:
  contents: write

jobs:
  gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESULT: research/results/EXP-041-final-gate-a-audit-v0.1.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen final Gate-A code
        run: python -m py_compile research/code/run_exp041_final_gate_a_audit.py

      - name: Run final Gate-A adequacy/provenance audit
        continue-on-error: true
        run: python research/code/run_exp041_final_gate_a_audit.py

      - name: Upload durable Gate-A audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp041-final-gate-a-audit
          path: research/results/EXP-041-final-gate-a-audit-v0.1.json
          if-no-files-found: warn

      - name: Commit durable Gate-A audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "Checkpoint EXP-041 final Gate-A audit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce frozen Gate-A decision
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-041-final-gate-a-audit-v0.1.json")
          if not p.exists():
              raise SystemExit("final Gate-A result missing")
          x=json.loads(p.read_text())
          if x["market_data_loaded"] or x["target_labels_calculated"] or x["pnl_calculated"] or x["scientific_market_outcomes_calculated"]:
              raise SystemExit("unexpected market outcome computation")
          if x["protected_periods"]["jul_aug_2026_loaded"] or x["protected_periods"]["sep_2026_loaded"]:
              raise SystemExit("protected-period leak")
          if not x["gate_a_pass"]:
              raise SystemExit("EXP-041 Gate A failed; Gate B remains prohibited")
          print("EXP-041 Gate A PASS; Gate B information-content study authorized")
          PY
