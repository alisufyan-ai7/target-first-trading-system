name: EXP-041 Official Release-Time Reconciliation v0.4

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-041-official-release-time-reconciliation-v04.txt'

permissions:
  contents: write

jobs:
  repair-bea:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESULT: research/results/EXP-041-official-release-time-reconciliation-v0.4.json
      MAP: research/data/EXP-041-official-release-time-map-v0.4.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify code
        run: python -m py_compile research/code/run_exp041_official_release_time_reconciliation_v04.py

      - name: Run targeted BEA repair
        continue-on-error: true
        run: python research/code/run_exp041_official_release_time_reconciliation_v04.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp041-official-release-time-v04
          path: |
            research/results/EXP-041-official-release-time-reconciliation-v0.4.json
            research/data/EXP-041-official-release-time-map-v0.4.json
          if-no-files-found: warn

      - name: Commit durable result
        if: always()
        run: |
          set -euo pipefail
          test -f "$RESULT"
          test -f "$MAP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT" "$MAP"
          git commit -m "Checkpoint EXP-041 official release-time reconciliation v0.4"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-041-official-release-time-reconciliation-v0.4.json")
          if not p.exists():
              raise SystemExit("v0.4 result missing")
          x=json.loads(p.read_text())
          if x["market_data_loaded"] or x["target_labels_calculated"] or x["pnl_calculated"] or x["scientific_outcomes_calculated"]:
              raise SystemExit("unexpected outcome computation")
          if x["protected_periods"]["jul_aug_2026_loaded"] or x["protected_periods"]["sep_2026_loaded"]:
              raise SystemExit("protected-period leak")
          if x["official_actual_reconciliation_complete"]:
              raise SystemExit("actual-value reconciliation remains Phase B")
          if not x["release_time_reconciliation_pass"]:
              raise SystemExit("official release-time v0.4 failed")
          print("EXP-041 official release-time v0.4 PASS")
          PY
