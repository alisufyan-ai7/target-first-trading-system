name: EXP-032 Engine N v0.1 Opening-Drive Preflight

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-032-engine-n-v0.1-preflight.txt'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy joblib scikit-learn==1.5.2

      - name: Verify zero-outcome Engine N v0.1
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/code/engine_n_v0_1.py
          python -m py_compile research/code/run_engine_n_v0_1_preflight.py
          PYTHONPATH=research/code python - <<'PY'
          import engine_n_v0_1 as n
          import run_engine_n_v0_1_preflight as r
          print(n.self_tests_engine_n_v01())
          print(r.synthetic_engine_n_tests())
          print("ZERO_OUTCOME_OPENING_DRIVE_PREFLIGHT=YES")
          PY

      - name: Run opening-drive preflight through June only
        run: PYTHONPATH=research/code python research/code/run_engine_n_v0_1_preflight.py

      - name: Upload EXP-032 preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp032-engine-n-v01-preflight
          path: research/results/EXP-032-opening-drive-preflight-v0.1.json
          if-no-files-found: warn

      - name: Commit durable EXP-032 preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f research/results/EXP-032-opening-drive-preflight-v0.1.json ]; then
            echo "No result file to checkpoint"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-032-opening-drive-preflight-v0.1.json
          git commit -m "Checkpoint EXP-032 Engine N v0.1 preflight"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce EXP-032 frozen preflight gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-032-opening-drive-preflight-v0.1.json")
          if not p.exists():
              raise SystemExit("EXP-032 preflight result missing")
          x=json.loads(p.read_text())
          if not x["preflight_pass"]:
              raise SystemExit("EXP-032 frozen preflight research gate FAILED")
          print("EXP-032 frozen preflight research gate PASSED")
          PY
