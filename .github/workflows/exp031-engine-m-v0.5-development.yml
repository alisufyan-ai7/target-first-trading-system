name: EXP-031 Engine M v0.5 Development

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-031-engine-m-v0.5-development.txt'

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy joblib scikit-learn==1.5.2

      - name: Verify frozen EXP-031 development
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/code/engine_m_v0_5.py
          python -m py_compile research/code/run_engine_m_v0_5_development.py
          PYTHONPATH=research/code python - <<'PY'
          import json, pathlib
          import engine_m_v0_5 as m5
          import run_engine_m_v0_5_development as r
          print(m5.self_tests_engine_m_v05())
          print(r.synthetic_recent_h1_tests())
          print(r.synthetic_fill_tests())
          print(r.self_tests_development())
          p=pathlib.Path("research/results/EXP-031-recent-h1-preflight-v0.5.json")
          x=json.loads(p.read_text())
          assert x["preflight_pass"] is True
          assert x["target_outcomes_calculated"] is False
          assert x["pnl_outcomes_calculated"] is False
          assert x["secondary_test_loaded_or_inspected"] is False
          assert x["final_holdout_loaded_or_inspected"] is False
          assert r.SEALED_START.isoformat()=="2026-07-01T00:00:00+00:00"
          print("JULY_AUGUST_AND_SEPTEMBER_SEALED=YES")
          PY

      - name: Run EXP-031 development through June only
        run: PYTHONPATH=research/code python research/code/run_engine_m_v0_5_development.py

      - name: Upload EXP-031 development result
        uses: actions/upload-artifact@v4
        with:
          name: exp031-engine-m-v05-development
          path: research/results/EXP-031-development-summary-v0.5.json
          if-no-files-found: error

      - name: Commit durable EXP-031 development checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-031-development-summary-v0.5.json
          git commit -m "Checkpoint EXP-031 Engine M v0.5 development"
          git pull --rebase origin main
          git push origin HEAD:main
