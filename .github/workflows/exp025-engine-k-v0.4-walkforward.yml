name: EXP-025 Engine K v0.4 Walk-Forward Selection

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-025-v0.4-walkforward.txt'

permissions:
  contents: write

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy joblib scikit-learn==1.5.2

      - name: Verify frozen EXP-025 search
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/code/run_engine_k_v0_4_walkforward_selection.py
          PYTHONPATH=research/code python - <<'PY'
          import run_engine_k_v0_4_walkforward_selection as r
          print(r.walkforward_self_tests())
          assert len(r.CONFIG_IDS)==12
          assert len(r.FOLDS)==6
          assert r.SEALED_START.isoformat()=="2026-07-01T00:00:00+00:00"
          print("JULY_AUGUST_AND_SEPTEMBER_SEALED=YES")
          PY

      - name: Run bounded Mar-Jun walk-forward selection only
        run: PYTHONPATH=research/code python research/code/run_engine_k_v0_4_walkforward_selection.py

      - name: Upload EXP-025 result
        uses: actions/upload-artifact@v4
        with:
          name: exp025-engine-k-v04-walkforward
          path: research/results/EXP-025-walkforward-selection-summary-v0.4.json
          if-no-files-found: error

      - name: Commit EXP-025 development checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-025-walkforward-selection-summary-v0.4.json
          git commit -m "Checkpoint EXP-025 Engine K v0.4 walk-forward selection"
          git pull --rebase origin main
          git push origin HEAD:main
