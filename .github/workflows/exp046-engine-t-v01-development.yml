name: EXP-046 Engine T v0.1 Structural Target Development

on:
  push:
    branches: [main]
    paths:
      - "research/triggers/EXP-046-engine-t-v0.1-development.txt"

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: 922f83a60cc574e7395fb27397077288055a1ef6
      SOURCE_REPO: /tmp/market-data-lab
      RESULT: research/results/EXP-046-engine-t-v0.1-development-summary.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify frozen development evaluator
        run: node --check research/code/run-exp046-engine-t-v01-development.js

      - name: Sparse-checkout pinned free Gold development source only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_REPO"
          git clone --filter=blob:none --no-checkout https://github.com/kevingtlin/Market-Data-Lab.git "$SOURCE_REPO"
          git -C "$SOURCE_REPO" sparse-checkout init --no-cone

          : > /tmp/exp046-development-sparse.txt
          D="2021-12-01"
          while [[ "$D" < "2025-03-01" ]]; do
            Y="$(date -u -d "$D" +%Y)"
            M="$(date -u -d "$D" +%m)"
            echo "/xauusd/bid/m1/xauusd_bid_m1_${Y}_${M}.csv" >> /tmp/exp046-development-sparse.txt
            D="$(date -u -d "$D +1 month" +%Y-%m-01)"
          done

          git -C "$SOURCE_REPO" sparse-checkout set --no-cone --stdin < /tmp/exp046-development-sparse.txt
          git -C "$SOURCE_REPO" checkout "$SOURCE_COMMIT"
          test "$(git -C "$SOURCE_REPO" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C "$SOURCE_REPO" status --porcelain)"

      - name: Run frozen Engine-T development outcome study
        env:
          EXP046_SOURCE_REPO: /tmp/market-data-lab
        run: node research/code/run-exp046-engine-t-v01-development.js

      - name: Upload development artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp046-engine-t-v01-development
          path: |
            research/results/EXP-046-engine-t-v0.1-development-summary.json
            research/results/EXP-046-engine-t-v0.1-development-signals.jsonl
            research/results/EXP-046-engine-t-v0.1-development-reference-trades.jsonl
          if-no-files-found: warn

      - name: Commit durable development checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-046-engine-t-v0.1-development-summary.json \
                  research/results/EXP-046-engine-t-v0.1-development-signals.jsonl \
                  research/results/EXP-046-engine-t-v0.1-development-reference-trades.jsonl
          git commit -m "Checkpoint EXP-046 Engine T v0.1 structural target development"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce integrity and frozen Engine-T development gate
        if: always()
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const p="research/results/EXP-046-engine-t-v0.1-development-summary.json";
          if(!fs.existsSync(p))throw new Error("EXP-046 development summary missing");
          const x=JSON.parse(fs.readFileSync(p,"utf8"));

          if(x.validation_or_holdout_loaded)throw new Error("validation/holdout leak");
          if(x.candidate_blob!=="975cf5ca15c532db44857a94bbb3baabf2d26919")
            throw new Error("candidate blob changed");
          if(x.zero_outcome_result_blob!=="47cb4fb8b28f96469ead35e5332789e618fd9291")
            throw new Error("preflight blob changed");
          if(x.frozen_protocol_commit!=="2f2aca9b1a67799f315de286da1f3913493ff865")
            throw new Error("protocol checkpoint changed");

          console.log("EXP-046 development disposition:",x.disposition);
          console.log("Target admitted:",x.target_admitted,"of",x.pre_target_candidates);

          if(!x.development_gate.engine_pass){
            console.error("Engine T failed the frozen development gate.");
            process.exit(1);
          }
          NODE
