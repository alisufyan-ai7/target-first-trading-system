name: EXP-041 Extended Development Market History

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-041-extended-market-history.txt'

permissions:
  contents: write

jobs:
  acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned transport and Python audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(npm view dukascopy-node@1.50.0 version)"
          PACKAGE_INTEGRITY="$(npm view dukascopy-node@1.50.0 dist.integrity || true)"
          printf '{"version":"%s","dist_integrity":"%s"}\n' "$PACKAGE_VERSION" "$PACKAGE_INTEGRITY" > /tmp/exp041_npm_meta.json
          npm install --no-save --ignore-scripts dukascopy-node@1.50.0
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Verify acquisition code
        run: |
          node --check research/code/download_exp041_dukas_m1.js
          python -m py_compile research/code/run_exp041_market_history_acquisition_audit.py

      - name: Acquire frozen 12-month M1 feed
        env:
          EXP041_DATA_DIR: /tmp/exp041-dukas-m1
        run: node research/code/download_exp041_dukas_m1.js

      - name: Audit coverage and overlap without labels
        env:
          EXP041_DATA_DIR: /tmp/exp041-dukas-m1
        run: PYTHONPATH=research/code python research/code/run_exp041_market_history_acquisition_audit.py

      - name: Upload durable audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp041-extended-market-history-audit
          path: research/results/EXP-041-extended-market-history-acquisition-audit-v0.1.json
          if-no-files-found: warn

      - name: Commit durable acquisition audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          P=research/results/EXP-041-extended-market-history-acquisition-audit-v0.1.json
          if [ ! -f "$P" ]; then
            echo "EXP-041 market-history audit missing"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$P"
          git commit -m "Checkpoint EXP-041 extended market history audit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce acquisition integrity only
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-041-extended-market-history-acquisition-audit-v0.1.json")
          if not p.exists():
              raise SystemExit("EXP-041 market-history result missing")
          x=json.loads(p.read_text())
          if not x["market_history_gate_pass"]:
              raise SystemExit("EXP-041 extended market-history gate FAILED")
          if x["scientific_outcomes_calculated"] or x["target_labels_calculated"] or x["pnl_calculated"]:
              raise SystemExit("unexpected scientific outcome computation")
          if x["protected_periods"]["jul_aug_2026_loaded"] or x["protected_periods"]["sep_2026_loaded"]:
              raise SystemExit("protected-period leak")
          print("EXP-041 extended market-history gate PASSED")
          PY
