name: EXP-023 Engine K v0.2 Zero-Outcome Preflight

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-023-preflight-v0.2.txt'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Syntax and v0.2 zero-outcome tests
        run: |
          python -m py_compile research/code/engine_k_v0_1.py
          python -m py_compile research/code/engine_k_v0_2.py
          python -m py_compile research/code/run_engine_k_v0_2_preflight.py
          PYTHONPATH=research/code python - <<'PY'
          import engine_k_v0_2 as e
          print(e.self_tests_v02())
          PY

      - name: Run v0.2 preflight through June only
        run: PYTHONPATH=research/code python research/code/run_engine_k_v0_2_preflight.py

      - name: Upload zero-outcome preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp023-engine-k-v02-preflight
          path: research/results/EXP-023-preflight-v0.2.json
          if-no-files-found: warn

      - name: Commit passing preflight checkpoint
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-023-preflight-v0.2.json
          git commit -m "Checkpoint EXP-023 Engine K v0.2 preflight"
          git pull --rebase origin main
          git push origin HEAD:main
