name: EXP-047 Blinded Human Selection Development

on:
  push:
    branches: [main]
    paths:
      - "research/triggers/EXP-047-blinded-human-selection-development-v0.1.txt"

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: 922f83a60cc574e7395fb27397077288055a1ef6
      SOURCE_REPO: /tmp/market-data-lab
      RESULT: research/results/EXP-047-blinded-human-selection-development-summary-v0.1.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify frozen EXP-047 evaluator
        run: node --check research/code/run-exp047-blinded-human-selection-development-v01.js

      - name: Verify frozen blinded label checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -f research/results/EXP-047-blinded-replay-labels-v0.1.jsonl
          test -f research/results/EXP-047-blinded-replay-label-summary-v0.1.json
          test -f research/results/EXP-047-blinded-replay-packets-v0.1.jsonl

      - name: Sparse-checkout pinned Gold development source only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_REPO"
          git clone --filter=blob:none --no-checkout https://github.com/kevingtlin/Market-Data-Lab.git "$SOURCE_REPO"
          git -C "$SOURCE_REPO" sparse-checkout init --no-cone
          : > /tmp/exp047-development-sparse.txt
          D="2021-12-01"
          while [[ "$D" < "2025-03-01" ]]; do
            Y="$(date -u -d "$D" +%Y)"
            M="$(date -u -d "$D" +%m)"
            echo "/xauusd/bid/m1/xauusd_bid_m1_${Y}_${M}.csv" >> /tmp/exp047-development-sparse.txt
            D="$(date -u -d "$D +1 month" +%Y-%m-01)"
          done
          git -C "$SOURCE_REPO" sparse-checkout set --no-cone --stdin < /tmp/exp047-development-sparse.txt
          git -C "$SOURCE_REPO" checkout "$SOURCE_COMMIT"
          test "$(git -C "$SOURCE_REPO" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C "$SOURCE_REPO" status --porcelain)"

      - name: Run frozen blinded-label outcome evaluation
        env:
          EXP047_SOURCE_REPO: /tmp/market-data-lab
        run: node research/code/run-exp047-blinded-human-selection-development-v01.js

      - name: Upload development artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp047-blinded-human-selection-development-v01
          path: |
            research/results/EXP-047-blinded-human-selection-development-summary-v0.1.json
            research/results/EXP-047-blinded-human-selection-order-audit-v0.1.jsonl
            research/results/EXP-047-blinded-human-selection-filled-signals-v0.1.jsonl
            research/results/EXP-047-blinded-human-selection-reference-trades-v0.1.jsonl
          if-no-files-found: warn

      - name: Commit durable development checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-047-blinded-human-selection-development-summary-v0.1.json \
                  research/results/EXP-047-blinded-human-selection-order-audit-v0.1.jsonl \
                  research/results/EXP-047-blinded-human-selection-filled-signals-v0.1.jsonl \
                  research/results/EXP-047-blinded-human-selection-reference-trades-v0.1.jsonl
          git commit -m "Checkpoint EXP-047 blinded human selection development"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce frozen EXP-047 development gate
        if: always()
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const p="research/results/EXP-047-blinded-human-selection-development-summary-v0.1.json";
          if(!fs.existsSync(p)) throw new Error("EXP-047 result missing");
          const x=JSON.parse(fs.readFileSync(p,"utf8"));
          if(x.frozen_protocol_commit!=="0306b2fa2f2cfee1ede9e886f0aa210ce5228f53") throw new Error("protocol changed");
          if(x.complete_label_checkpoint_commit!=="92837503784151a0596618e36700cdc593068233") throw new Error("label checkpoint changed");
          if(x.label_blob!=="e9bb8b70593e52653adfbfc47606b5b6a1c0e82e") throw new Error("label blob changed");
          if(x.packet_blob!=="e6eeeed45a0e0181b23d0d3ba3497b5521677c41") throw new Error("packet blob changed");
          if(x.validation_or_holdout_loaded) throw new Error("protected source leak");
          console.log("EXP-047 development disposition:",x.disposition);
          console.log("Filled:",x.filled_signals,"of",x.trade_orders);
          if(!x.development_gate.pass){
            console.error("EXP-047 blinded human selection failed the frozen development gate.");
            process.exit(1);
          }
          NODE
