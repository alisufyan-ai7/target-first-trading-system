name: EXP-041 Macro Catalyst Information Content Gate B

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-041-gate-b-macro-information-content.txt'

permissions:
  contents: write

jobs:
  gate-b:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXP041_DUKA_DIR: /tmp/exp041-dukas-v2
      SNAPSHOT_TAG: exp041-data-dukas-m1-2025-07-01_2026-06-30-v2
      SNAPSHOT_ASSET: exp041-dukas-m1-2025-07-01_2026-06-30-v2.tar.gz
      SNAPSHOT_SHA: 90bc7301e459062e8e35cd89a1a9aac23332ca3472014dd2cc5045ba34794272
      RESULT: research/results/EXP-041-macro-catalyst-information-content-v0.1.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn==1.5.2

      - name: Verify frozen Gate-B code
        run: |
          set -euo pipefail
          python -m py_compile research/code/mtf_information_v0_1.py
          python -m py_compile research/code/run_exp041_macro_information_content.py

      - name: Download immutable Dukascopy v2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/exp041-release "$EXP041_DUKA_DIR"
          gh release download "$SNAPSHOT_TAG" --pattern "$SNAPSHOT_ASSET" --dir /tmp/exp041-release
          test "$(sha256sum "/tmp/exp041-release/$SNAPSHOT_ASSET" | awk '{print $1}')" = "$SNAPSHOT_SHA"
          tar -xzf "/tmp/exp041-release/$SNAPSHOT_ASSET" -C "$EXP041_DUKA_DIR"
          ls -la "$EXP041_DUKA_DIR"

      - name: Run EXP-041 Gate-B information-content study
        run: PYTHONPATH=research/code python research/code/run_exp041_macro_information_content.py

      - name: Upload durable Gate-B result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp041-gate-b-macro-information-content
          path: research/results/EXP-041-macro-catalyst-information-content-v0.1.json
          if-no-files-found: warn

      - name: Commit durable Gate-B result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "Checkpoint EXP-041 macro information-content Gate B"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce Gate-B integrity only
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-041-macro-catalyst-information-content-v0.1.json")
          if not p.exists():
              raise SystemExit("EXP-041 Gate-B result missing")
          x=json.loads(p.read_text())
          if not x["integrity"]["integrity_pass"]:
              raise SystemExit("EXP-041 Gate-B integrity FAILED")
          if x["scope"]["secondary_test_loaded_or_labeled"] or x["scope"]["final_holdout_loaded_or_labeled"]:
              raise SystemExit("protected-period seal failed")
          if x["scope"]["engine_r_or_exp015_outcomes_used"]:
              raise SystemExit("paused engine outcomes leaked into Gate B")
          print("EXP-041 Gate-B integrity PASSED")
          print("Scientific disposition:",x["disposition"])
          PY
