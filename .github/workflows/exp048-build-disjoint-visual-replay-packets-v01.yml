name: EXP-048 Build Disjoint Visual Replay Packets

on:
  push:
    branches: [main]
    paths:
      - "research/triggers/EXP-048-build-disjoint-visual-replay-packets-v0.1.txt"

permissions:
  contents: write

jobs:
  packet_build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: 922f83a60cc574e7395fb27397077288055a1ef6
      SOURCE_REPO: /tmp/market-data-lab
      SUMMARY: research/results/EXP-048-blinded-replay-summary-v0.1.json
      PACKETS: research/results/EXP-048-blinded-replay-packets-v0.1.jsonl

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify frozen EXP-048 packet generator
        run: node --check research/code/run-exp048-build-disjoint-visual-replay-packets-v01.js

      - name: Verify pinned EXP-047 packet source
        run: test -f research/results/EXP-047-blinded-replay-packets-v0.1.jsonl

      - name: Sparse-checkout pinned free Gold development source only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_REPO"
          git clone --filter=blob:none --no-checkout https://github.com/kevingtlin/Market-Data-Lab.git "$SOURCE_REPO"
          git -C "$SOURCE_REPO" sparse-checkout init --no-cone
          : > /tmp/exp048-sparse.txt
          D="2021-12-01"
          while [[ "$D" < "2025-03-01" ]]; do
            Y="$(date -u -d "$D" +%Y)"
            M="$(date -u -d "$D" +%m)"
            echo "/xauusd/bid/m1/xauusd_bid_m1_${Y}_${M}.csv" >> /tmp/exp048-sparse.txt
            D="$(date -u -d "$D +1 month" +%Y-%m-01)"
          done
          git -C "$SOURCE_REPO" sparse-checkout set --no-cone --stdin < /tmp/exp048-sparse.txt
          git -C "$SOURCE_REPO" checkout "$SOURCE_COMMIT"
          test "$(git -C "$SOURCE_REPO" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C "$SOURCE_REPO" status --porcelain)"

      - name: Build disjoint zero-outcome visual replay packets
        env:
          EXP048_SOURCE_REPO: /tmp/market-data-lab
        run: node research/code/run-exp048-build-disjoint-visual-replay-packets-v01.js

      - name: Enforce EXP-048 packet integrity
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const s=JSON.parse(fs.readFileSync("research/results/EXP-048-blinded-replay-summary-v0.1.json","utf8"));
          const lines=fs.readFileSync("research/results/EXP-048-blinded-replay-packets-v0.1.jsonl","utf8").trim().split("\n").filter(Boolean).map(JSON.parse);
          if(s.protocol_commit!=="59d426bd56c82a7d48a6081bc695a7a8eaa657e7") throw new Error("protocol changed");
          if(s.selected_packet_count!==126||lines.length!==126) throw new Error("packet count");
          if(!s.disjoint_from_exp047||s.exp047_overlap_count!==0) throw new Error("EXP-047 overlap");
          if(s.exp047_packet_blob!=="e6eeeed45a0e0181b23d0d3ba3497b5521677c41") throw new Error("prior packet changed");
          if(s.validation_or_holdout_files_loaded) throw new Error("protected leak");
          if(s.target_labels_calculated||s.mfe_mae_calculated||s.pnl_calculated||s.post_decision_path_loaded) throw new Error("outcome leak");
          if(!s.all_packets_causal||!s.all_packets_unlabeled) throw new Error("causal/unlabeled integrity");
          for(const n of Object.values(s.selected_cell_counts)) if(n!==7) throw new Error("stratification changed");
          if(Object.keys(s.selected_cell_counts).length!==18) throw new Error("cell count changed");
          console.log("EXP-048 DISJOINT VISUAL PACKETS PASS",s.packet_jsonl_sha256);
          NODE

      - name: Upload packet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exp048-disjoint-visual-replay-packets-v01
          path: |
            research/results/EXP-048-blinded-replay-summary-v0.1.json
            research/results/EXP-048-blinded-replay-packets-v0.1.jsonl
          if-no-files-found: error

      - name: Commit durable packet checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SUMMARY" "$PACKETS"
          git commit -m "Checkpoint EXP-048 disjoint visual replay packets v0.1"
          git pull --rebase origin main
          git push origin HEAD:main
