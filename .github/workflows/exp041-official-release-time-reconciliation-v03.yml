name: EXP-041 Official Release-Time Reconciliation v0.3

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-041-official-release-time-reconciliation-v03.txt'

permissions:
  contents: write

jobs:
  reconcile-times:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESULT: research/results/EXP-041-official-release-time-reconciliation-v0.3.json
      MAP: research/data/EXP-041-official-release-time-map-v0.3.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official-source parsers
        run: pip install beautifulsoup4 pypdf

      - name: Verify frozen reconciliation code
        run: python -m py_compile research/code/run_exp041_official_release_time_reconciliation_v03.py

      - name: Reconcile first-party release times v0.3
        continue-on-error: true
        run: python research/code/run_exp041_official_release_time_reconciliation_v03.py

      - name: Upload v0.3 reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp041-official-release-time-reconciliation-v03
          path: |
            research/results/EXP-041-official-release-time-reconciliation-v0.3.json
            research/data/EXP-041-official-release-time-map-v0.3.json
          if-no-files-found: warn

      - name: Commit v0.3 reconciliation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT"
          test -f "$MAP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT" "$MAP"
          git commit -m "Checkpoint EXP-041 official release-time reconciliation v0.3"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce v0.3 provenance gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-041-official-release-time-reconciliation-v0.3.json")
          if not p.exists():
              raise SystemExit("v0.3 official release-time result missing")
          x=json.loads(p.read_text())
          if x["market_data_loaded"] or x["target_labels_calculated"] or x["pnl_calculated"] or x["scientific_outcomes_calculated"]:
              raise SystemExit("unexpected market outcome computation")
          if x["protected_periods"]["jul_aug_2026_loaded"] or x["protected_periods"]["sep_2026_loaded"]:
              raise SystemExit("protected-period leak")
          if x["official_actual_reconciliation_complete"]:
              raise SystemExit("actual-value reconciliation remains Phase B")
          if not x["release_time_reconciliation_pass"]:
              raise SystemExit("official release-time v0.3 failed: "+str(x["disposition"]))
          print("EXP-041 official release-time reconciliation v0.3 PASS; official actual values required next")
          PY
