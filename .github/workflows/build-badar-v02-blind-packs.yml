name: Build Badar v0.2 blind annotator packs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-badar-v02-blind-packs.yml"
      - "research/human-strategy-library/traders/badar/current-era-decision-model-v0.1/mechanization-v0.2/candidate-events-v0.2.csv"
      - "research/human-strategy-library/traders/badar/current-era-decision-model-v0.1/mechanization-v0.2/INDEPENDENT-ANNOTATOR-INSTRUCTIONS-v0.2.md"
      - "research/human-strategy-library/traders/badar/current-era-decision-model-v0.1/mechanization-v0.2/tools/build_blind_packs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build blind packs
        run: python research/human-strategy-library/traders/badar/current-era-decision-model-v0.1/mechanization-v0.2/tools/build_blind_packs.py
      - name: Upload A
        uses: actions/upload-artifact@v4
        with:
          name: badar-v02-annotator-A
          path: _badar_v02_blind_build/annotator-A-badar-v0.2.zip
          retention-days: 14
      - name: Upload B
        uses: actions/upload-artifact@v4
        with:
          name: badar-v02-annotator-B
          path: _badar_v02_blind_build/annotator-B-badar-v0.2.zip
          retention-days: 14
      - name: Upload sealed crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: badar-v02-sealed-crosswalk
          path: _badar_v02_blind_build/SEALED-v0.2-crosswalk.csv
          retention-days: 14
      - name: Upload build summary
        uses: actions/upload-artifact@v4
        with:
          name: badar-v02-build-summary
          path: |
            _badar_v02_blind_build/BUILD-SUMMARY.json
            _badar_v02_blind_build/excluded-events.csv
          retention-days: 14
