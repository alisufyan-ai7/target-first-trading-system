name: EXP-041 Free Macro Source Preflight

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-041-free-macro-source-preflight.txt'

permissions:
  contents: write

jobs:
  free-macro-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESULT: research/results/EXP-041-free-macro-source-preflight-v0.1.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen preflight code
        run: python -m py_compile research/code/run_exp041_free_macro_source_preflight.py

      - name: Run free public-source access/provenance preflight
        continue-on-error: true
        run: python research/code/run_exp041_free_macro_source_preflight.py

      - name: Upload durable preflight diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp041-free-macro-source-preflight
          path: research/results/EXP-041-free-macro-source-preflight-v0.1.json
          if-no-files-found: warn

      - name: Commit durable preflight diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RESULT" ]; then
            echo "free macro source preflight result missing"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "Checkpoint EXP-041 free macro source preflight"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce free-source provenance gate only
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-041-free-macro-source-preflight-v0.1.json")
          if not p.exists():
              raise SystemExit("free macro source preflight result missing")
          x=json.loads(p.read_text())
          if x["target_labels_calculated"] or x["pnl_calculated"] or x["scientific_outcomes_calculated"]:
              raise SystemExit("unexpected outcome computation")
          if x["market_data_loaded"]:
              raise SystemExit("market data should not be loaded in this preflight")
          if x["protected_periods"]["jul_aug_2026_loaded"] or x["protected_periods"]["sep_2026_loaded"]:
              raise SystemExit("protected-period leak")
          if not x["preflight_pass"]:
              raise SystemExit("EXP-041 free macro source preflight failed: "+str(x["disposition"]))
          print("EXP-041 free macro source architecture preflight PASSED")
          PY
