name: EXP-030 Engine M v0.4 H1 Range Preflight

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-030-engine-m-v0.4-preflight.txt'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy joblib scikit-learn==1.5.2

      - name: Verify zero-outcome Engine M v0.4
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/code/engine_m_v0_1.py
          python -m py_compile research/code/engine_m_v0_2.py
          python -m py_compile research/code/engine_m_v0_4.py
          python -m py_compile research/code/run_engine_m_v0_4_preflight.py
          PYTHONPATH=research/code python - <<'PY'
          import engine_m_v0_1 as m1
          import engine_m_v0_2 as m2
          import engine_m_v0_4 as m4
          import run_engine_m_v0_4_preflight as r
          print(m1.self_tests_engine_m())
          print(m2.self_tests_engine_m_v02())
          print(m4.self_tests_engine_m_v04())
          print(r.synthetic_h1_range_tests())
          print(r.synthetic_fill_tests())
          print("ZERO_OUTCOME_H1_RANGE_PREFLIGHT=YES")
          PY

      - name: Run H1-range preflight through June only
        run: PYTHONPATH=research/code python research/code/run_engine_m_v0_4_preflight.py

      - name: Upload EXP-030 preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp030-engine-m-v04-preflight
          path: research/results/EXP-030-h1-range-preflight-v0.4.json
          if-no-files-found: warn

      - name: Commit durable EXP-030 preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f research/results/EXP-030-h1-range-preflight-v0.4.json ]; then
            echo "No result file to checkpoint"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-030-h1-range-preflight-v0.4.json
          git commit -m "Checkpoint EXP-030 Engine M v0.4 preflight"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce EXP-030 frozen preflight gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-030-h1-range-preflight-v0.4.json")
          if not p.exists():
              raise SystemExit("EXP-030 preflight result missing")
          x=json.loads(p.read_text())
          if not x["preflight_pass"]:
              raise SystemExit("EXP-030 frozen preflight research gate FAILED")
          print("EXP-030 frozen preflight research gate PASSED")
          PY
