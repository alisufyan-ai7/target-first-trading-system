name: EXP-045 Engine S v0.2 Structural Target Development

on:
  push:
    branches: [main]
    paths:
      - "research/triggers/EXP-045-engine-s-v0.2-development.txt"

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: 922f83a60cc574e7395fb27397077288055a1ef6
      SOURCE_REPO: /tmp/market-data-lab
      RESULT: research/results/EXP-045-engine-s-v0.2-development-summary.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify frozen development evaluator
        run: node --check research/code/run-exp045-engine-s-v02-development.js

      - name: Sparse-checkout pinned free Gold development source only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_REPO"
          git clone --filter=blob:none --no-checkout https://github.com/kevingtlin/Market-Data-Lab.git "$SOURCE_REPO"
          git -C "$SOURCE_REPO" sparse-checkout init --no-cone

          : > /tmp/exp045-development-sparse.txt
          D="2021-12-01"
          while [[ "$D" < "2025-03-01" ]]; do
            Y="$(date -u -d "$D" +%Y)"
            M="$(date -u -d "$D" +%m)"
            echo "/xauusd/bid/m1/xauusd_bid_m1_${Y}_${M}.csv" >> /tmp/exp045-development-sparse.txt
            D="$(date -u -d "$D +1 month" +%Y-%m-01)"
          done

          git -C "$SOURCE_REPO" sparse-checkout set --no-cone --stdin < /tmp/exp045-development-sparse.txt
          git -C "$SOURCE_REPO" checkout "$SOURCE_COMMIT"
          test "$(git -C "$SOURCE_REPO" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C "$SOURCE_REPO" status --porcelain)"

      - name: Run frozen Engine-S development outcome study
        env:
          EXP045_SOURCE_REPO: /tmp/market-data-lab
        run: node research/code/run-exp045-engine-s-v02-development.js

      - name: Upload development artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp045-engine-s-v02-development
          path: |
            research/results/EXP-045-engine-s-v0.2-development-summary.json
            research/results/EXP-045-engine-s-v0.2-development-signals.jsonl
            research/results/EXP-045-engine-s-v0.2-development-reference-trades.jsonl
          if-no-files-found: warn

      - name: Commit durable development checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-045-engine-s-v0.2-development-summary.json \
                  research/results/EXP-045-engine-s-v0.2-development-signals.jsonl \
                  research/results/EXP-045-engine-s-v0.2-development-reference-trades.jsonl
          git commit -m "Checkpoint EXP-045 Engine S v0.2 structural target development"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce integrity and frozen branch development gate
        if: always()
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const p="research/results/EXP-045-engine-s-v0.2-development-summary.json";
          if(!fs.existsSync(p))throw new Error("EXP-045 development summary missing");
          const x=JSON.parse(fs.readFileSync(p,"utf8"));

          if(x.validation_or_holdout_loaded)throw new Error("validation/holdout leak");
          if(x.candidate_blob!=="e49f13b7b558ccd4b35130596ec103eedc800b55")
            throw new Error("candidate blob changed");
          if(x.zero_outcome_result_blob!=="717b3f99edd58d47d3e7088b845ddb8a4d0a4583")
            throw new Error("preflight blob changed");
          if(x.frozen_protocol_commit!=="85600a74e2e6dc3f4efaf64d5cde385f89bc4758")
            throw new Error("protocol checkpoint changed");

          console.log("EXP-045 development disposition:",x.disposition);
          console.log("Passing branches:",JSON.stringify(x.passing_branches));
          console.log("Target admitted:",x.target_admitted,"of",x.pre_target_candidates);

          if(!x.passing_branches.length){
            console.error("No Engine-S branch passed the frozen development gate.");
            process.exit(1);
          }
          NODE
