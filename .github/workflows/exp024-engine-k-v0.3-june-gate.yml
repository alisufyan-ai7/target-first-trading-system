name: EXP-024 Engine K v0.3 June Development Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-024-v0.3-june-gate.txt'

permissions:
  contents: write

jobs:
  june-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy joblib scikit-learn==1.5.2

      - name: Verify sealed v0.3 runner
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/code/engine_k_v0_1.py
          python -m py_compile research/code/engine_k_v0_2.py
          python -m py_compile research/code/run_engine_k_v0_2_training_calibration.py
          python -m py_compile research/code/run_engine_k_v0_3_june_gate.py
          PYTHONPATH=research/code python - <<'PY'
          import run_engine_k_v0_3_june_gate as r
          print(r.self_tests_v03())
          assert r.SEALED_START.isoformat()=="2026-07-01T00:00:00+00:00"
          print("JULY_AUGUST_AND_SEPTEMBER_SEALED=YES")
          PY

      - name: Run Mar-Apr fit, May calibration, June gate only
        run: PYTHONPATH=research/code python research/code/run_engine_k_v0_3_june_gate.py

      - name: Upload v0.3 June gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exp024-engine-k-v03-june-gate
          path: |
            research/results/EXP-024-june-development-summary-v0.3.json
            research/results/EXP-024-june-gate-model-bundle-v0.3.joblib
          if-no-files-found: error

      - name: Commit v0.3 June checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-024-june-development-summary-v0.3.json
          git add research/results/EXP-024-june-gate-model-bundle-v0.3.joblib
          git commit -m "Checkpoint EXP-024 Engine K v0.3 June gate"
          git pull --rebase origin main
          git push origin HEAD:main
