name: EXP-042 Rates USD Interpretation Information Content

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-042-rates-usd-information-content.txt'

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_TAG: exp041-data-dukas-m1-2025-07-01_2026-06-30-v2
      TARGET_ASSET: exp041-dukas-m1-2025-07-01_2026-06-30-v2.tar.gz
      TARGET_SHA: 90bc7301e459062e8e35cd89a1a9aac23332ca3472014dd2cc5045ba34794272
      PROXY_TAG: exp042-rates-usd-proxy-m1-2025-07-01_2026-06-30-v1
      PROXY_ASSET: exp042-rates-usd-proxy-m1-2025-07-01_2026-06-30-v1.tar.gz
      PROXY_SHA: 86cef306c36f08a12510c563e307a3158dc45d3236a424251db4d1c1bbaedcb4
      EXP041_DUKA_DIR: /tmp/exp041-dukas-v2
      EXP042_PROXY_DIR: /tmp/exp042-proxy
      RESULT: research/results/EXP-042-rates-usd-interpretation-information-content-v0.1.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn==1.5.2

      - name: Verify frozen runner
        run: |
          python -m py_compile research/code/mtf_information_v0_1.py
          python -m py_compile research/code/run_exp042_rates_usd_information_content.py

      - name: Download immutable target-market snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/exp041-release "$EXP041_DUKA_DIR"
          gh release download "$TARGET_TAG" --pattern "$TARGET_ASSET" --dir /tmp/exp041-release
          test "$(sha256sum "/tmp/exp041-release/$TARGET_ASSET" | awk '{print $1}')" = "$TARGET_SHA"
          tar -xzf "/tmp/exp041-release/$TARGET_ASSET" -C "$EXP041_DUKA_DIR"

      - name: Download immutable proxy snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/exp042-release "$EXP042_PROXY_DIR"
          gh release download "$PROXY_TAG" --pattern "$PROXY_ASSET" --dir /tmp/exp042-release
          test "$(sha256sum "/tmp/exp042-release/$PROXY_ASSET" | awk '{print $1}')" = "$PROXY_SHA"
          tar -xzf "/tmp/exp042-release/$PROXY_ASSET" -C "$EXP042_PROXY_DIR"

      - name: Run EXP-042 information-content study
        run: PYTHONPATH=research/code python research/code/run_exp042_rates_usd_information_content.py

      - name: Upload durable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp042-rates-usd-information-content
          path: research/results/EXP-042-rates-usd-interpretation-information-content-v0.1.json
          if-no-files-found: warn

      - name: Commit durable result
        if: always()
        run: |
          set -euo pipefail
          test -f "$RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "Checkpoint EXP-042 rates USD information-content study"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce study integrity only
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("research/results/EXP-042-rates-usd-interpretation-information-content-v0.1.json").read_text())
          if not x["integrity"]["integrity_pass"]:
              raise SystemExit("EXP-042 information-content integrity failed")
          if x["scope"]["secondary_test_loaded_or_labeled"] or x["scope"]["final_holdout_loaded_or_labeled"]:
              raise SystemExit("protected-period leak")
          if x["scope"]["engine_r_or_exp015_outcomes_used"]:
              raise SystemExit("paused engine outcomes leaked")
          print("EXP-042 information-content integrity PASS")
          print(x["study_dispositions"])
          PY
