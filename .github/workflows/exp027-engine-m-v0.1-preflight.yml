name: EXP-027 Engine M v0.1 MTF Limit Preflight

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-027-engine-m-preflight-v0.1.txt'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy joblib scikit-learn==1.5.2

      - name: Verify zero-outcome Engine M mechanics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/code/engine_m_v0_1.py
          python -m py_compile research/code/run_engine_m_v0_1_preflight.py
          PYTHONPATH=research/code python - <<'PY'
          import engine_m_v0_1 as e
          import run_engine_m_v0_1_preflight as r
          print(e.self_tests_engine_m())
          print(r.synthetic_setup_tests())
          print(r.synthetic_fill_tests())
          print("ZERO_OUTCOME_PREFLIGHT=YES")
          PY

      - name: Run MTF limit mechanics preflight through June only
        run: PYTHONPATH=research/code python research/code/run_engine_m_v0_1_preflight.py

      - name: Upload preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp027-engine-m-v01-preflight
          path: research/results/EXP-027-entry-mechanics-preflight-v0.1.json
          if-no-files-found: warn

      - name: Commit durable preflight checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f research/results/EXP-027-entry-mechanics-preflight-v0.1.json ]; then
            echo "No result file to checkpoint"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-027-entry-mechanics-preflight-v0.1.json
          git commit -m "Checkpoint EXP-027 Engine M v0.1 preflight"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce frozen preflight research gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/results/EXP-027-entry-mechanics-preflight-v0.1.json")
          if not p.exists():
              raise SystemExit("preflight result missing")
          x=json.loads(p.read_text())
          if not x["preflight_pass"]:
              raise SystemExit("EXP-027 frozen preflight research gate FAILED")
          print("EXP-027 frozen preflight research gate PASSED")
          PY
