name: EXP-026 Engine L v0.1 Entry Mechanics Preflight

on:
  push:
    branches: [ main ]
    paths:
      - 'research/triggers/EXP-026-engine-l-preflight-v0.1.txt'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn==1.5.2 joblib

      - name: Verify zero-outcome entry mechanics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/code/engine_l_v0_1.py
          python -m py_compile research/code/run_engine_l_v0_1_preflight.py
          PYTHONPATH=research/code python - <<'PY'
          import engine_l_v0_1 as e
          import run_engine_l_v0_1_preflight as r
          print(e.self_tests_engine_l())
          print(r.synthetic_entry_tests())
          print("NO_ENGINE_L_OUTCOMES=YES")
          PY

      - name: Run mechanics preflight through June only
        run: PYTHONPATH=research/code python research/code/run_engine_l_v0_1_preflight.py

      - name: Upload preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp026-engine-l-entry-preflight
          path: research/results/EXP-026-entry-mechanics-preflight-v0.1.json
          if-no-files-found: warn

      - name: Commit passing preflight checkpoint
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/EXP-026-entry-mechanics-preflight-v0.1.json
          git commit -m "Checkpoint EXP-026 Engine L entry mechanics preflight"
          git pull --rebase origin main
          git push origin HEAD:main
