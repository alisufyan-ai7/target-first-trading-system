name: EXP-022 Engine K Preflight

on:
  push:
    branches: [ main ]
    paths:
      - 'research/code/engine_k_v0_1.py'
      - 'research/code/run_engine_k_preflight.py'
      - 'research/provenance/EXP-022-wave1-data-manifest.md'
      - '.github/workflows/exp022-engine-k-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Engine K zero-outcome preflight
        working-directory: research/code
        run: |
          python run_engine_k_preflight.py

      - name: Upload preflight result
        uses: actions/upload-artifact@v4
        with:
          name: exp022-engine-k-preflight
          path: research/code/research/results/exp022/preflight.json
          if-no-files-found: error
